name: Week 04 Day 01 - Node CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test

    runs-on: ubuntu-latest

    timeout-minutes: 10

    defaults:
      run:
        working-directory: week-04-ci-cd/day-01-github-actions-basics/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: week-04-ci-cd/day-01-github-actions-basics/app/package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: npm run lint

      - name: Run automated tests
        run: npm test