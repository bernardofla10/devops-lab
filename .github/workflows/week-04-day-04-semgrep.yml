name: Week 04 Day 04 - Semgrep SAST

on:
  push:
    branches:
      - main

    paths:
      - "week-04-ci-cd/day-04-semgrep-sast/**"
      - ".github/workflows/week-04-day-04-semgrep.yml"

  pull_request:
    branches:
      - main

    paths:
      - "week-04-ci-cd/day-04-semgrep-sast/**"
      - ".github/workflows/week-04-day-04-semgrep.yml"

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

env:
  LAB_DIRECTORY: week-04-ci-cd/day-04-semgrep-sast
  SEMGREP_IMAGE: semgrep/semgrep:latest

jobs:
  quality:
    name: Application quality

    runs-on: ubuntu-latest

    timeout-minutes: 10

    defaults:
      run:
        working-directory: week-04-ci-cd/day-04-semgrep-sast/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: week-04-ci-cd/day-04-semgrep-sast/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: npm run lint

      - name: Run automated tests
        run: npm test

  semgrep:
    name: Semgrep SAST security gate

    runs-on: ubuntu-latest

    timeout-minutes: 15

    outputs:
      finding_count: ${{ steps.results.outputs.finding_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show Semgrep version
        run: |
          docker run --rm \
            "$SEMGREP_IMAGE" \
            semgrep --version

      - name: Test custom Semgrep rules
        working-directory: ${{ env.LAB_DIRECTORY }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --metrics=off \
              --test \
              --config semgrep-rules/rules \
              semgrep-rules/tests

      - name: Generate Semgrep reports
        working-directory: ${{ env.LAB_DIRECTORY }}
        run: |
          mkdir -p reports

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --metrics=off \
              --config semgrep-rules/rules \
              --text \
              --text-output=reports/semgrep.txt \
              --json-output=reports/semgrep.json \
              --sarif-output=reports/semgrep.sarif \
              app/src

      - name: Read finding count
        id: results
        working-directory: ${{ env.LAB_DIRECTORY }}
        run: |
          finding_count="$(
            jq '.results | length' \
              reports/semgrep.json
          )"

          echo "finding_count=$finding_count" \
            >> "$GITHUB_OUTPUT"

          echo "Semgrep findings: $finding_count"

      - name: Upload Semgrep reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semgrep-sast-reports
          path: week-04-ci-cd/day-04-semgrep-sast/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload SARIF to GitHub code scanning
        if: >-
          ${{
            always() &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: week-04-ci-cd/day-04-semgrep-sast/reports/semgrep.sarif
          category: semgrep-week04-day04

      - name: Enforce Semgrep security gate
        working-directory: ${{ env.LAB_DIRECTORY }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --metrics=off \
              --config semgrep-rules/rules \
              --error \
              app/src

  docker-build:
    name: Docker build after security gate

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs:
      - quality
      - semgrep

    defaults:
      run:
        working-directory: week-04-ci-cd/day-04-semgrep-sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build Docker image
        run: |
          docker build \
            -t "semgrep-sast-lab:${GITHUB_SHA::7}" \
            .

      - name: Inspect Docker image
        run: |
          docker image inspect \
            "semgrep-sast-lab:${GITHUB_SHA::7}"

  workflow-summary:
    name: Generate workflow summary

    runs-on: ubuntu-latest

    timeout-minutes: 5

    if: ${{ always() }}

    needs:
      - quality
      - semgrep
      - docker-build

    steps:
      - name: Write security summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Week 04 Day 04 - Semgrep SAST

          | Job | Result |
          |---|---|
          | Application quality | ${{ needs.quality.result }} |
          | Semgrep SAST gate | ${{ needs.semgrep.result }} |
          | Docker build | ${{ needs.docker-build.result }} |

          **Semgrep findings:** \`${{ needs.semgrep.outputs.finding_count }}\`

          **Commit:** \`${{ github.sha }}\`
          EOF
