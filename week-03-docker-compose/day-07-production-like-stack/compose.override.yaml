services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"

    restart: "no"

  api:
    command:
      - node
      - --watch
      - server.js

    ports:
      - "127.0.0.1:${API_DIRECT_PORT:-8100}:3000"

    volumes:
      - ./app/server.js:/app/server.js:ro
      - ./app/integration-test.js:/app/integration-test.js:ro

    restart: "no"

  gateway:
    restart: "no"

  adminer:
    restart: "no"