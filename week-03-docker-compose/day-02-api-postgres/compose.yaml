name: devops-compose-day02

services:
  db:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-devopsdb}"
      POSTGRES_USER: "${POSTGRES_USER:-devops}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"

    volumes:
      - postgres-data:/var/lib/postgresql # caminho em que o volume é montado
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro # inicialização

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" # O $$ impede que o Compose substitua a variável antecipadamente. 
          # Assim, $POSTGRES_USER e $POSTGRES_DB serão avaliados dentro do container.
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: devops-compose-api-postgres:day02

    ports:
      - "${API_HOST_PORT:-8090}:3000"

    environment:
      APP_NAME: "${APP_NAME:-compose-api-postgres-day02}"
      APP_ENV: "${APP_ENV:-development}"
      PORT: "3000"

      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-devopsdb}"
      DB_USER: "${POSTGRES_USER:-devops}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"

    depends_on:
      db:
        condition: service_healthy
        restart: true

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

volumes:
  postgres-data: